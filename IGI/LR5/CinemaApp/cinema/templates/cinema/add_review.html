{% extends 'cinema/base.html' %}
{% load static %}
{% block head %}
    {{ block.super }}
	<link rel="stylesheet" href="{% static 'css\add_review.css' %}" type="text/css"/>
{% endblock %}
{% block header %}Add Review{% endblock %}
{% block content %}

{% comment %} <form method="POST">
	{% csrf_token %}
	<center><h2>Enter review</h2>
	<b>{{ form.as_p }}</b>
	<button type="submit" >Publish</button>
</form> {% endcomment %}

<section>
	<form action="{% url 'add_review' %}" method="POST" class="review-form">
		{% csrf_token %}
		<div class="form-group">
			<label for="text">Your Review:</label>
			<textarea id="text" name="text" rows="4" cols="50" required></textarea>
		</div>
		<div class="form-group">
			<label for="rate">Rate (1-5):</label>
			<input type="number" id="rate" name="rate" min="1" max="5" required>
		</div>
		<button type="submit" class="form-input" class="submit-button">Submit Review</button>
	</form>
</section>

{% endblock content%}
