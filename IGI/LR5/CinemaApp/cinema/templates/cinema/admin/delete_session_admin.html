{% extends 'cinema/admin/base_admin.html' %}

{% block header %}Delete Session{% endblock %}

{% block content %}
<form method="POST" enctype='multipart/form-data'>
    {% csrf_token %}
    <select name="session">
        {% for session in sessions %}
            <option value="{{ session.pk }}">{{ session.movie.title }}, {{ session.hall.name }}, {{ session.start_time }}, {{session.end_time}}</option>
        {% endfor %}
    </select>
    <button type="submit">Delete</button>
</form>

{% endblock %}
