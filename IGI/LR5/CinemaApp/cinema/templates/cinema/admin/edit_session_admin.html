{% extends 'cinema/admin/base_admin.html' %}

{% block header %}Edit Session{% endblock %}

{% block content %}
<form method="POST" enctype='multipart/form-data'>
    {% csrf_token %}
    <select name="session">
        {% for session in sessions %}
            <option value="{{ session.pk }}">{{ session.movie.title }}, {{ session.hall.name }}, {{ session.start_time }}</option>
        {% endfor %}
    </select>
    {{ form.as_p }}
    <button type="submit">Save</button>
</form>

{% endblock %}
