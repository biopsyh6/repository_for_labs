{% extends 'cinema/base.html' %}
{% load static %}
{% block head %}
    {{ block.super }}
	<link rel="stylesheet" href="{% static 'css\edit_profile.css' %}" type="text/css"/>
{% endblock %}
{% block header %}Edit Profile{% endblock %}
{% block content %}


    {% comment %} <form method="POST" enctype='multipart/form-data'>
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Save changes</button>
    <form> {% endcomment %}

<section>
    <form method="POST" class="edit-form" enctype='multipart/form-data'>
        {% csrf_token %}
        <div class="form-group">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" value="{{ form.name.value }}" class="form-control">
        </div>
        <div class="form-group">
            <label for="surname">Surname:</label>
            <input type="text" id="surname" name="surname" value="{{ form.surname.value }}" class="form-control">
        </div>
        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" value="{{ form.email.value }}" class="form-control">
        </div>
        <div class="form-group">
            <label for="birth_date">Birth Date:</label>
            <input type="date" disabled id="birth_date" name="birth_date" value="{{ form.birth_date.value }}" class="form-control">
        </div>
        <div class="form-group">
            <label for="phone_number">Phone Number:</label>
            <input type="text" id="phone_number" name="phone_number" value="{{ form.phone_number.value }}" class="form-control">
        </div>
        <div class="form-group">
            <label for="image" class="button_file">Profile Image</label>
            <input type="file" id="image" name="image" class="form-control">
        </div>
        <button type="submit" class="form-input" class="submit-button">Save changes</button>
    </form>    
</section>
{% endblock %}
