{% extends 'cinema/base.html' %}
{% block header %}Cat Facts{% endblock %}

{% block content %}
<section translate="yes">
    {% for fact in facts %}
        <article>
            <div style="border: 1px solid #ccc; padding: 10px; margin-bottom: 20px; margin-top: 20px">
                <p>Fact: {{ fact }}</p>
            </div>
        </article>
    {% endfor %}
</section>
{% endblock %}
